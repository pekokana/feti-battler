name: Deploy Flet App to GitHub Pages

on:
  push:
    branches:
      - main  # mainブランチにPushされた時に実行

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version" # 管理ファイルに合わせる

      - name: Install dependencies
        run: |
          uv sync

      - name: Flet Publish
        run: |
          # アプリのビルド
          uv run flet publish ./main.py --base-url /feti-battler/app/ --web-renderer canvaskit
          
          # フォルダ整理
          mv dist app
          mkdir final_dist
          mv app final_dist/
          
          # ルート資産（LP、SEO関連）を全てコピー
          cp index.html final_dist/
          cp sitemap.xml final_dist/
          cp robots.txt final_dist/
          cp google*.html final_dist/  


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./final_dist
          publish_branch: gh-pages
